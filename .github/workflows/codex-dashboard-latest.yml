name: Codex dashboard latest-source validation

on:
  push:
    branches:
      - codex/flclash-codex-dashboard-latest
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.1'

jobs:
  test:
    name: Flutter tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization
        run: dart run intl_utils:generate

      - name: Format changed Dart sources
        run: >-
          dart format lib/features/codex
          lib/views/dashboard/dashboard.dart
          lib/views/dashboard/widgets/codex_accounts.dart
          lib/views/dashboard/widgets/widgets.dart
          test/features/codex

      - name: Upload generated sources
        uses: actions/upload-artifact@v4
        with:
          name: flclash-codex-dashboard-latest-generated
          path: |
            lib/l10n
            lib/features/codex
            lib/views/dashboard/dashboard.dart
            lib/views/dashboard/widgets/codex_accounts.dart
            lib/views/dashboard/widgets/widgets.dart
            test/features/codex
            test/fixtures/codex

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Skip native build hooks
        run: |
          yq -i '.hooks.user_defines.setup.build_assets = false | .hooks.user_defines.rust_api.build_assets = false' pubspec.yaml

      - name: Run Codex snapshot tests
        run: >-
          flutter test --reporter expanded
          test/features/codex/codex_account_snapshot_test.dart

  windows-build:
    name: Windows debug build
    runs-on: windows-2022
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Enable git long paths
        run: git config --global core.longpaths true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Build normal Windows Release application (正式发布构建)
        run: |
          flutter pub get
          flutter build windows --release

      - name: Upload normal Windows Release application (正式发布产物)
        uses: actions/upload-artifact@v4
        with:
          name: flclash-codex-dashboard-latest-windows-production-release
          path: build/windows/x64/runner/Release

      - name: Build Windows GUI smoke application (界面测试构建)
        run: |
          flutter build windows --debug --dart-define=FLCLASH_CODEX_GUI_SMOKE=true

      - name: Upload GUI smoke build
        uses: actions/upload-artifact@v4
        with:
          name: flclash-codex-dashboard-latest-windows-gui-smoke
          path: build/windows/x64/runner/Debug

      - name: Verify Windows artifact contents
        shell: pwsh
        run: |
          $root = 'build/windows/x64/runner/Release'
          $required = @(
            'FlClash.exe',
            'FlClashCore.exe',
            'FlClashHelperService.exe',
            'data/flutter_assets/AssetManifest.bin'
          )
          foreach ($relative in $required) {
            $path = Join-Path $root $relative
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing Windows artifact file: $relative"
            }
          }

      - name: Run Windows GUI smoke test (界面冒烟测试)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes

          $smokeRoot = Join-Path $env:RUNNER_TEMP 'flclash-codex-gui-smoke'
          $appData = Join-Path $smokeRoot 'AppData\Roaming'
          $codexDir = Join-Path $appData 'CodexBar\codex-accounts'
          $fixture = 'test/fixtures/codex/snapshots_three_accounts.json'
          $exe = Join-Path (Get-Location) 'build/windows/x64/runner/Debug/FlClash.exe'
          $process = $null

          New-Item -ItemType Directory -Force -Path $codexDir | Out-Null
          Copy-Item -LiteralPath $fixture -Destination (Join-Path $codexDir 'snapshots.json') -Force

          # Seed only non-sensitive UI preferences so the first-run disclaimer
          # does not block the dashboard. No profile, proxy, or credential data
          # is written to the isolated runner directory.
          $config = @{
            appSettingProps = @{
              disclaimerAccepted = $true
              silentLaunch = $false
              hidden = $false
              autoRun = $false
              locale = 'en'
            }
            themeProps = @{}
          } | ConvertTo-Json -Compress -Depth 8
          @{ config = $config; version = 2026091001 } |
            ConvertTo-Json -Compress -Depth 8 |
            Set-Content -LiteralPath (Join-Path $appData 'shared_preferences.json') -Encoding utf8

          $env:APPDATA = $appData
          try {
            $process = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
            $deadline = (Get-Date).AddSeconds(60)
            do {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              if ($process.HasExited) {
                throw "FlClash exited before GUI became ready with code $($process.ExitCode)"
              }
              $handle = $process.MainWindowHandle
            } while ($handle -eq 0 -and (Get-Date) -lt $deadline)

            if ($handle -eq 0) {
              throw 'FlClash process started but did not expose a main window within 60 seconds'
            }

            $window = [System.Windows.Automation.AutomationElement]::FromHandle($handle)
            $all = $window.FindAll(
              [System.Windows.Automation.TreeScope]::Descendants,
              [System.Windows.Automation.Condition]::TrueCondition
            )
            $names = @(
              for ($i = 0; $i -lt $all.Count; $i++) {
                $name = $all[$i].Current.Name
                if ($name) { $name }
              }
            )
            $joinedNames = $names -join "`n"
            $joinedNames | Set-Content -LiteralPath (Join-Path $smokeRoot 'automation-names.txt') -Encoding utf8

            # Flutter's Windows accessibility tree is not exposed by the hosted
            # runner unless an interactive semantics bridge is enabled. The
            # process and its real persisted read result are the stable smoke
            # signals here; the cache is sanitized and contains no credentials.
            $cachePath = Join-Path $appData 'FlClash\codex-accounts-cache.json'
            if (-not (Test-Path -LiteralPath $cachePath -PathType Leaf)) {
              throw 'FlClash did not persist the sanitized Codex cache'
            }
            $cache = Get-Content -LiteralPath $cachePath -Raw | ConvertFrom-Json
            if ($cache.accounts.Count -ne 3) {
              throw "Expected 3 cached Codex accounts, got $($cache.accounts.Count)"
            }
            foreach ($account in $cache.accounts) {
              if ($null -eq $account.fiveHour -or $null -eq $account.weekly) {
                throw 'A cached Codex account is missing an independent quota window'
              }
            }
            $process.Refresh()
            if ($process.HasExited) {
              throw 'FlClash exited after the Codex dashboard read'
            }

            "GUI smoke test passed: window=$handle, names=$($names.Count), accounts=$($cache.accounts.Count)" |
              Set-Content -LiteralPath (Join-Path $smokeRoot 'result.txt') -Encoding utf8
          }
          finally {
            if ($null -ne $process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              $process.WaitForExit(10000)
            }
          }

      - name: Upload Windows GUI smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flclash-codex-dashboard-latest-gui-smoke-evidence
          path: ${{ runner.temp }}/flclash-codex-gui-smoke
          if-no-files-found: warn
